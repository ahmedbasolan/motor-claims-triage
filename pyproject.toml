[project]
name = "motor-claims-triage"
version = "0.1.0"
description = "Motor Claims Triage & Decision-Support Copilot"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # Floor verified against the data, round 5: probed the 1.49.0 wheel
    # and every Streamlit element the theme styles for elements the app
    # renders (selectbox, virtual dropdown, metrics, sidebar) exists
    # there; tests/test_theme.py guards the same targets for drift.
    "streamlit>=1.49.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
]

[build-system]
# PEP 639 (license = "MIT" as an SPDX expression, emitted as
# License-Expression) needs setuptools 77+; the previous floor (68) would
# reject the pyproject.toml it is declared next to.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

# B/C4/SIM/RUF added in the round-7 quality pass; every finding was
# fixed rather than ignored (see git history).
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Gates production code (src, app, eval); tests are covered by ruff and
# the suite. explicit_package_bases resolves app/ and eval/ as namespace
# packages so "theme" and "app.theme" are not two modules.
files = ["src", "app", "eval"]
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
